name: Build zELF ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout zELF
        uses: actions/checkout@v4
        with:
          repository: seb3773/zelf
          ref: main

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            clang \
            lld \
            binutils \
            nasm \
            make \
            python3 \
            python3-pip \
            git \
            file

      - name: Verify ARM64 environment
        run: |
          set -eux
          uname -m
          gcc --version
          ld.lld --version

          test "$(uname -m)" = "aarch64"

      - name: Build zELF
        shell: bash
        run: |
          set -o pipefail

          echo "=== Native ARM64 build ==="

          if make CC=gcc CXX=g++ STUBS_J=1 -j1 2>&1 | tee build.log; then
            echo "BUILD_OK=1" >> "$GITHUB_ENV"
          else
            echo "BUILD_OK=0" >> "$GITHUB_ENV"
          fi

      - name: ARM64 fallback without LZHAM
        if: env.BUILD_OK == '0'
        shell: bash
        run: |
          set -eux

          echo "=== Fallback build ==="

          cp Makefile Makefile.backup

          # Disable LZHAM-related build entries.
          sed -i \
            -e '/stub_lzham_/d' \
            -e '/stub_sfx_lzham/d' \
            Makefile

          sed -i \
            -E 's/(^|[[:space:]])lzham([[:space:]]|$)/ /g' \
            Makefile

          make clean || true

          make CC=gcc CXX=g++ STUBS_J=1 -j1

      - name: Verify binary
        run: |
          set -eux

          test -f build/zelf
          file build/zelf
          readelf -h build/zelf

          echo
          echo "=== zELF version ==="
          ./build/zelf --version || true

      - name: Package
        run: |
          mkdir -p artifact
          cp build/zelf artifact/zelf-aarch64
          tar -czf zelf-aarch64.tar.gz -C artifact zelf-aarch64

      - name: Upload zELF
        uses: actions/upload-artifact@v4
        with:
          name: zelf-aarch64
          path: |
            artifact/zelf-aarch64
            zelf-aarch64.tar.gz
